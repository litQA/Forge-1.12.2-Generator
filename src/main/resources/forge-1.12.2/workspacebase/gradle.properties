# Gradle 9.8 runs on the modern JDK used by MCreator, while RetroFuturaGradle
# compiles and runs the mod with a Java 8 toolchain. A local JDK 8 is detected
# automatically; otherwise Gradle provisions one through the Foojay resolver.
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
