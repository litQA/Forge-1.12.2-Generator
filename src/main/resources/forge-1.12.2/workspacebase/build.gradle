plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.6'
    id 'com.gradleup.shadow' version '9.2.2'
}

def modId = 'modid'
try {
    def mcmodInfo = new groovy.json.JsonSlurper().parse(file('src/main/resources/mcmod.info'))
    if (mcmodInfo instanceof List && !mcmodInfo.isEmpty() && mcmodInfo[0].modid) {
        modId = mcmodInfo[0].modid
    }
} catch (Throwable ignored) {
    // The generated mcmod.info is normally available before Gradle configures.
}
def mixinConfigName = 'mixins.' + modId + '.json'
def mixinRefMapName = 'mixins.' + modId + '.refmap.json'
def mixinPackage = 'org.spongepowered.' + modId.replace('_', '')

version = '1.0'
group = 'com.example.modid'
base {
    archivesName = 'modid'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

minecraft {
    mcVersion = '1.12.2'
    // MCreator 1.12.2 uses the MCP snapshot mappings. The MCP "stable" mappings
    // use Mojang official names (createIcon, setTranslationKey) that do not
    // match the 1.12.2 API names used by MCreator and its name mappings.
    mcpMappingChannel = 'snapshot'
    mcpMappingVersion = '20171003'
    username = 'Developer'
    javaCompatibilityVersion = 8
}

repositories {
    mavenCentral()
    maven {
        name = 'MinecraftForge'
        url = uri('https://maven.minecraftforge.net/')
    }
    maven {
        name = 'SpongePowered'
        url = uri('https://repo.spongepowered.org/maven')
    }
}

configurations {
    embed
    implementation.extendsFrom(embed)
}

// RetroFuturaGradle 2.0.6 pins 1.12.2 to Forge 2847 internally. Pin the
// resolved Forge dependency to 2864 so the generated workspace uses the
// requested build instead of only changing the displayed metadata.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'net.minecraftforge' && details.requested.name == 'forge') {
            details.useVersion '1.12.2-14.23.5.2864'
        }
    }
}

dependencies {
    def mixin = modUtils.enableMixins('org.spongepowered:mixin:0.7.11-SNAPSHOT', mixinRefMapName)
    implementation(mixin) { transitive = false }
    annotationProcessor 'org.ow2.asm:asm-debug-all:5.2'
    annotationProcessor 'com.google.guava:guava:24.1.1-jre'
    annotationProcessor 'com.google.code.gson:gson:2.8.6'
    annotationProcessor(mixin) { transitive = false }
    embed('org.spongepowered:mixin:0.7.11-SNAPSHOT') { transitive = false }
}

minecraft {
    extraTweakClasses.add('org.spongepowered.asm.launch.MixinTweaker')
    extraRunJvmArguments.add('-Dmixin.configs=' + mixinConfigName)
}

jar {
    manifest {
        attributes(
            'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
            'MixinConfigs': mixinConfigName,
            'ForceLoadAsMod': 'true'
        )
    }
    doFirst {
        // Shadow 9 shares the manifest object with shadowJar. Restore the
        // development tweaker after the production manifest is configured.
        manifest.attributes('TweakClass': 'org.spongepowered.asm.launch.MixinTweaker')
    }
}

// Relocate the embedded Mixin runtime into a mod-specific namespace. Without
// this, every exported mod ships org.spongepowered.asm and the first loaded
// copy wins, which breaks mods that embed a different Mixin build.
shadowJar {
    archiveClassifier = 'shadow'
    configurations = [project.configurations.embed]
    relocate 'org.spongepowered', mixinPackage
    mergeServiceFiles()
    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/*.DSA'
    manifest {
        attributes(
            'TweakClass': mixinPackage + '.asm.launch.MixinTweaker',
            'MixinConfigs': mixinConfigName,
            'ForceLoadAsMod': 'true'
        )
    }
    doFirst {
        // Restore the relocated tweaker for the production jar.
        manifest.attributes('TweakClass': mixinPackage + '.asm.launch.MixinTweaker')
    }
}

afterEvaluate {
    tasks.named('reobfJar') {
        inputJarFromTask(tasks.named('shadowJar'))
    }
}

// 1.12.2 loads banner/shield pattern overlays from the minecraft namespace,
// regardless of the pattern definition's owning mod. Mirror the generated
// textures into that namespace in the processed resource output.
processResources {
    doLast {
        // Modern block textures use names that do not exist in 1.12.2.
        // Rewrite references in the processed models to their legacy equivalents.
        def textureAliases = [
                '"minecraft:blocks/granite"': '"minecraft:blocks/stone_granite"',
                '"minecraft:blocks/diorite"': '"minecraft:blocks/stone_diorite"',
                '"minecraft:blocks/andesite"': '"minecraft:blocks/stone_andesite"',
                '"minecraft:blocks/dark_prismarine"': '"minecraft:blocks/prismarine_dark"',
                '"minecraft:blocks/prismarine"': '"minecraft:blocks/prismarine_rough"',
                '"minecraft:blocks/cobbled_deepslate"': '"minecraft:blocks/cobblestone"',
                '"minecraft:blocks/deepslate"': '"minecraft:blocks/stone"',
                '"minecraft:blocks/soul_soil"': '"minecraft:blocks/soul_sand"',
                '"minecraft:blocks/crying_obsidian"': '"minecraft:blocks/obsidian"',
                '"minecraft:blocks/honeycomb_block"': '"minecraft:blocks/wool_colored_yellow"',
                '"minecraft:blocks/blackstone_top"': '"minecraft:blocks/stone"',
                '"minecraft:blocks/blackstone"': '"minecraft:blocks/stone"',
                '"minecraft:blocks/basalt_top"': '"minecraft:blocks/stone"',
                '"minecraft:blocks/basalt_side"': '"minecraft:blocks/stone"',
                '"minecraft:blocks/tuff"': '"minecraft:blocks/stone"',
                '"minecraft:blocks/dripstone_block"': '"minecraft:blocks/stone"',
                '"minecraft:items/heart_of_the_sea"': '"minecraft:items/prismarine_crystals"'
        ]
        def assetRoot = file(buildDir.toString() + '/resources/main/assets')
        if (assetRoot.exists()) {
            fileTree(assetRoot) { include '**/models/**/*.json' }.each { modelFile ->
                def text = modelFile.getText('UTF-8')
                def updated = text
                textureAliases.each { current, legacy ->
                    updated = updated.replace(current, legacy)
                }
                if (updated != text)
                    modelFile.setText(updated, 'UTF-8')
            }
        }
        ['banner', 'shield'].each { kind ->
            def source = file('src/main/resources/assets/' + modId + '/textures/entity/' + kind)
            def target = file(buildDir.toString() + '/resources/main/assets/minecraft/textures/entity/' + kind)
            if (source.exists()) {
                source.listFiles()?.findAll { it.name.endsWith('.png') }?.each { sourceFile ->
                    def image = javax.imageio.ImageIO.read(sourceFile)
                    if (image == null)
                        return
                    target.mkdirs()
                    def targetFile = new File(target, sourceFile.name)
                    if (image.width == 64 && image.height == 64) {
                        targetFile.bytes = sourceFile.bytes
                    } else {
                        def scaled = new java.awt.image.BufferedImage(64, 64, java.awt.image.BufferedImage.TYPE_INT_ARGB)
                        def graphics = scaled.createGraphics()
                        graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION,
                                java.awt.RenderingHints.VALUE_INTERPOLATION_NEAREST_NEIGHBOR)
                        graphics.drawImage(image, 0, 0, 64, 64, null)
                        graphics.dispose()
                        javax.imageio.ImageIO.write(scaled, 'png', targetFile)
                    }
                }
            }
        }
    }
}

// mcreator.gradle is written by MCreator before Gradle is invoked.
if (file('mcreator.gradle').exists()) {
    apply from: 'mcreator.gradle'
}
