plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.6'
}

def modId = 'modid'
try {
    def mcmodInfo = new groovy.json.JsonSlurper().parse(file('src/main/resources/mcmod.info'))
    if (mcmodInfo instanceof List && !mcmodInfo.isEmpty() && mcmodInfo[0].modid) {
        modId = mcmodInfo[0].modid
    }
} catch (Throwable ignored) {
    // The generated mcmod.info is normally available before Gradle configures.
}
def mixinConfigName = "mixins.${modId}.json"
def mixinRefMapName = "mixins.${modId}.refmap.json"

version = '1.0'
group = 'com.example.modid'
base {
    archivesName = 'modid'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

minecraft {
    mcVersion = '1.12.2'
    // MCreator 1.12.2 uses the MCP snapshot mappings. The MCP "stable" mappings
    // use Mojang official names (createIcon, setTranslationKey) that do not
    // match the 1.12.2 API names used by MCreator and its name mappings.
    mcpMappingChannel = 'snapshot'
    mcpMappingVersion = '20171003'
    username = 'Developer'
    javaCompatibilityVersion = 8
}

repositories {
    mavenCentral()
    maven {
        name = 'SpongePowered'
        url = uri('https://repo.spongepowered.org/maven')
    }
}

configurations {
    embed
    implementation.extendsFrom(embed)
}

dependencies {
    def mixin = modUtils.enableMixins('org.spongepowered:mixin:0.7.11-SNAPSHOT', mixinRefMapName)
    implementation(mixin) { transitive = false }
    annotationProcessor 'org.ow2.asm:asm-debug-all:5.2'
    annotationProcessor 'com.google.guava:guava:24.1.1-jre'
    annotationProcessor 'com.google.code.gson:gson:2.8.6'
    annotationProcessor(mixin) { transitive = false }
    embed('org.spongepowered:mixin:0.7.11-SNAPSHOT') { transitive = false }
}

minecraft {
    extraTweakClasses.add('org.spongepowered.asm.launch.MixinTweaker')
    extraRunJvmArguments.add("-Dmixin.configs=${mixinConfigName}")
    extraRunJvmArguments.add('-Dmixin.debug=true')
}

jar {
    manifest {
        attributes(
            'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
            'MixinConfigs': mixinConfigName,
            'ForceLoadAsMod': 'true'
        )
    }
    from(provider { configurations.embed.collect { it.isDirectory() ? it : zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/*.DSA'
    }
}

// 1.12.2 loads banner/shield pattern overlays from the minecraft namespace,
// regardless of the pattern definition's owning mod. Mirror the generated
// textures into that namespace in the processed resource output.
processResources {
    doLast {
        ['banner', 'shield'].each { kind ->
            def source = file("src/main/resources/assets/${modId}/textures/entity/${kind}")
            def target = file("${buildDir}/resources/main/assets/minecraft/textures/entity/${kind}")
            if (source.exists()) {
                source.listFiles()?.findAll { it.name.endsWith('.png') }?.each { sourceFile ->
                    def image = javax.imageio.ImageIO.read(sourceFile)
                    if (image == null)
                        return
                    target.mkdirs()
                    def targetFile = new File(target, sourceFile.name)
                    if (image.width == 64 && image.height == 64) {
                        targetFile.bytes = sourceFile.bytes
                    } else {
                        def scaled = new java.awt.image.BufferedImage(64, 64, java.awt.image.BufferedImage.TYPE_INT_ARGB)
                        def graphics = scaled.createGraphics()
                        graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION,
                                java.awt.RenderingHints.VALUE_INTERPOLATION_NEAREST_NEIGHBOR)
                        graphics.drawImage(image, 0, 0, 64, 64, null)
                        graphics.dispose()
                        javax.imageio.ImageIO.write(scaled, 'png', targetFile)
                    }
                }
            }
        }
    }
}

// mcreator.gradle is written by MCreator before Gradle is invoked.
if (file('mcreator.gradle').exists()) {
    apply from: 'mcreator.gradle'
}
