plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.6'
}

version = '1.0'
group = 'com.example.modid'
base {
    archivesName = 'modid'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

minecraft {
    mcVersion = '1.12.2'
    // MCreator 1.12.2 uses the MCP snapshot mappings. The MCP "stable" mappings
    // use Mojang official names (createIcon, setTranslationKey) that do not
    // match the 1.12.2 API names used by MCreator and its name mappings.
    mcpMappingChannel = 'snapshot'
    mcpMappingVersion = '20171003'
    username = 'Developer'
    javaCompatibilityVersion = 8
}

repositories {
    mavenCentral()
}

dependencies {
}

// mcreator.gradle is written by MCreator before Gradle is invoked.
if (file('mcreator.gradle').exists()) {
    apply from: 'mcreator.gradle'
}
