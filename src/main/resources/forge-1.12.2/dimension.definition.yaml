templates:
  - template: dimension/dimension.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/world/dimension/@NAMEWorldProvider.java"
  - template: dimension/dimension_biomeprovider.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/world/dimension/@NAMEBiomeProvider.java"
  - template: dimension/chunkgenerator_void.java.ftl
    condition: "worldGenType %= Void gen"
    name: "@SRCROOT/@BASEPACKAGEPATH/world/dimension/@NAMEChunkGeneratorVoid.java"
  - template: dimension/blockportal.java.ftl
    condition: enablePortal
    name: "@SRCROOT/@BASEPACKAGEPATH/block/@NAMEPortalBlock.java"
  - template: dimension/portaltrigger.java.ftl
    condition: hasIgniter()
    name: "@SRCROOT/@BASEPACKAGEPATH/item/@NAMEItem.java"
  - template: json/dimension_portal.json.ftl
    writer: json
    condition: enablePortal
    name: "@MODASSETSROOT/blockstates/@registryname_portal.json"
  - template: json/dimension_portal_ew.json.ftl
    writer: json
    condition: enablePortal
    name: "@MODASSETSROOT/models/block/@registryname_portal_ew.json"
  - template: json/dimension_portal_ns.json.ftl
    writer: json
    condition: enablePortal
    name: "@MODASSETSROOT/models/block/@registryname_portal_ns.json"
  - template: json/dimension_portal_item.json.ftl
    writer: json
    condition: hasIgniter()
    name: "@MODASSETSROOT/models/item/@registryname.json"
  - template: dimension/skybox.java.ftl
    condition: enableCustomSkyboxTextures
    name: "@SRCROOT/@BASEPACKAGEPATH/client/@NAMESkyRenderer.java"

global_templates:
  - template: elementinits/dimensions.java.ftl
    condition: "${(dimensions![])?has_content}"
    name: "@SRCROOT/@BASEPACKAGEPATH/init/@JavaModNameDimensions.java"

# 1.12.2 uses WorldProvider + DimensionType; modern dimension JSON, custom
# skyboxes, aquifers, noise settings, raids/piglins and portal services are not
# available in this batch.
field_exclusions: [biomesInDimensionCaves, mainFillerBlock, fluidBlock, seaLevel,
                   generateOreVeins, generateAquifers, horizontalNoiseSize, verticalNoiseSize,
                   infiniburnTag, skyType, enableCustomSunMoonTextures,
                   sunTexture, moonTexture, sunHeightAffectsFog,
                   piglinSafe, hasRaids, minMonsterSpawnLightLimit, maxMonsterSpawnLightLimit,
                   monsterSpawnBlockLightLimit,
                   portalParticles, specialInformation,
                   portalMakeCondition, portalUseCondition, whenPortaTriggerlUsed, onPortalTickUpdate]

localizationkeys:
  - key: item.@modid.@registryname.name
    mapto: igniterName
    condition: hasIgniter()
