templates:
  - template: item/extension/dispensebehavior.java.ftl
    condition: hasDispenseBehavior
    name: "@SRCROOT/@BASEPACKAGEPATH/item/extension/@NAMEItemExtension.java"

global_templates:
  - template: elementinits/fuels.java.ftl
    condition: "${w.hasElementsOfType('itemextension')}"
    name: "@SRCROOT/@BASEPACKAGEPATH/init/@JavaModNameFuels.java"
  - template: elementinits/itemextensions.java.ftl
    condition: "${w.hasElementsOfType('itemextension')}"
    name: "@SRCROOT/@BASEPACKAGEPATH/init/@JavaModNameItemExtensions.java"

# Composting has no Forge 1.12.2 equivalent.
field_exclusions: [compostLayerChance]
