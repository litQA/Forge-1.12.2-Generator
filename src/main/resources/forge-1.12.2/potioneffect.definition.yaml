templates:
  - template: potioneffect/potioneffect.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/potion/@NAMEMobEffect.java"

global_templates:
  - template: elementinits/potioneffects.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/init/@JavaModNameMobEffects.java"

localizationkeys:
