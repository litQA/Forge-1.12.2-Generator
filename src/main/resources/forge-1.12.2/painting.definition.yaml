templates:
  - template: painting/painting_item.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/item/@NAMEItem.java"
  - template: painting/painting_entity.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/entity/@NAMEPaintingEntity.java"
  - template: json/painting_item.json.ftl
    writer: json
    name: "@MODASSETSROOT/models/item/@registryname.json"

global_templates:
  - template: elementinits/paintings.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/init/@JavaModNamePaintings.java"
    condition: "${(types.paintings![])?has_content}"
  - template: painting/painting_renderers.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/client/@JavaModNamePaintingRenderers.java"
    condition: "${(types.paintings![])?has_content}"

localizationkeys:
  - key: item.@modid.@registryname.name
    mapto: title
  - key: painting.@modid.@registryname.title
    mapto: title
  - key: painting.@modid.@registryname.author
    mapto: author
