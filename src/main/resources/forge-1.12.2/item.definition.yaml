templates:
  - template: item/item.java.ftl
    name: "@SRCROOT/@BASEPACKAGEPATH/item/@NAMEItem.java"
  - template: json/item.json.ftl
    writer: json
    condition: hasNormalModel()
    name: "@MODASSETSROOT/models/item/@registryname.json"
  - template: json/tool.json.ftl
    writer: json
    condition: hasToolModel()
    name: "@MODASSETSROOT/models/item/@registryname.json"
  # JSON, OBJ and Java models are planned for a later batch. Stop generation
  # instead of emitting an item without a model.
  - template: modbase/unsupported.ftl
    condition: "renderType #= 1"
    variables: "feature=item render type 'custom JSON model'"
    name: "@SRCROOT/@BASEPACKAGEPATH/item/@NAMEItemJsonModelUnsupported.java"
  - template: modbase/unsupported.ftl
    condition: "renderType #= 2"
    variables: "feature=item render type 'custom OBJ model'"
    name: "@SRCROOT/@BASEPACKAGEPATH/item/@NAMEItemObjModelUnsupported.java"
  - template: modbase/unsupported.ftl
    condition: "renderType #= 3"
    variables: "feature=item render type 'custom Java model'"
    name: "@SRCROOT/@BASEPACKAGEPATH/item/@NAMEItemJavaModelUnsupported.java"

# Fields that have no implementation in this batch. Exclusions are used instead
# of inclusions because inclusion cleanup hides every component it could not map
# by reflection, which makes element editors unusable for grouped controls.
field_exclusions: [guiTexture, customProperties, states, animations, immuneToFire,
                   isPiglinCurrency, repairItems, specialInformation, glowCondition,
                   guiBoundTo, openGUIOnRightClick, inventorySize, inventoryStackSize,
                   onRightClickedInAir, onRightClickedOnBlock, onCrafted, onEntityHitWith,
                   onItemInInventoryTick, onItemInUseTick, onStoppedUsing, onEntitySwing,
                   onDroppedByPlayer, onFinishUsingItem, everyTickWhileUsing,
                   onItemEntityDestroyed, enableRanged, shootConstantly, rangedItemChargesPower,
                   projectile, projectileDisableAmmoCheck, onRangedItemUsed, rangedUseCondition,
                   eatResultItem, isMusicDisc, musicDiscMusic, musicDiscDescription,
                   musicDiscLengthInTicks, musicDiscAnalogOutput, providedBannerPatterns,
                   attributeModifiers]

localizationkeys:
  - key: item.@modid.@registryname.name
    mapto: name
